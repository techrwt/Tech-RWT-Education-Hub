<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latest Answers - Tech RWT Education Hub</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>

  <header>
    <div class="logo">
      Tech RWT <span>Education Hub</span>
    </div>
    <nav>
      <a href="../index.html">Home</a>
      <a href="answers.html">Answers</a>
      <a href="../index.html#doubt-section">Ask Doubt</a>
    </nav>
  </header>

  <section class="resources">
    <h2>📘 Latest Answered Doubts</h2>
    <div id="answers-container" class="grid">
      <p id="loading-text">Loading answers...</p>
    </div>
  </section>

  <footer>
    <p>© Tech RWT Education Hub. All rights reserved.</p>
  </footer>

  <!-- Firebase Integration -->
  <script type="module">
    import { db } from "../firebase/config.js";
import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const answersContainer = document.getElementById("answers-container");

    async function fetchAnswers() {
      try {
        // Sirf un doubts ko mangwao jinka status 'answered' hai
        const q = query(collection(db, "questions"), where("status", "==", "answered"));
        
        const querySnapshot = await getDocs(q);
        answersContainer.innerHTML = "";

        if (querySnapshot.empty) {
          answersContainer.innerHTML = "<p>Abhi tak koi answer publish nahi hua hai.</p>";
          return;
        }

        querySnapshot.forEach((doc) => {
          const data = doc.data();
          const card = document.createElement("div");
          card.className = "card";
          card.style.textAlign = "left";
          card.style.cursor = "default";
          
          card.innerHTML = `
            <h3 style="color: #2563eb; margin-bottom: 10px;">❓ ${data.question || data.subject || "Doubt"}</h3>
            <p style="margin-bottom: 15px; color: #334155;"><strong>Answer:</strong> ${data.answer || "Answer details..."}</p>
            <small style="color: #64748b;">Subject: ${data.subject || 'General'} | Student: ${data.name || 'Anonymous'}</small>
          `;
          
          answersContainer.appendChild(card);
        });
      } catch (error) {
        console.error("Error fetching answers:", error);
        answersContainer.innerHTML = "<p style='color: red;'>Answers load karne me problem aayi. Please refresh karein.</p>";
      }
    }

    fetchAnswers();
  </script>
</body>
</html>
