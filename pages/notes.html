<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Notes - TECH RWT Education Hub</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f7fb;
}

header{
background:#2563eb;
color:white;
padding:18px;
text-align:center;
}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

.notes-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
gap:20px;
}

.card{
background:white;
border-radius:10px;
padding:18px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.card h3{
margin-bottom:10px;
color:#1e293b;
}

.info{
font-size:14px;
color:#64748b;
margin-bottom:8px;
}

.btn{
display:inline-block;
margin-top:12px;
background:#2563eb;
color:white;
padding:10px 15px;
text-decoration:none;
border-radius:6px;
font-size:14px;
}

.empty{
text-align:center;
padding:50px;
font-size:18px;
color:#64748b;
}
</style>

</head>
<body>

<header>

<h1>📚 Study Notes</h1>

<p>TECH RWT Education Hub</p>

</header>

<div class="container">

<div id="notes-list" class="notes-grid">

<div class="empty">Loading Notes...</div>

</div>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>

// ==========================
// PASTE YOUR FIREBASE CONFIG
// ==========================

const firebaseConfig = {
    apiKey: "AIzaSyD3S1wg31KRNbFPm483H-JZH1aFSUV4Org",
    authDomain: "tech-rwt-education-hub.firebaseapp.com",
    projectId: "tech-rwt-education-hub",
    storageBucket: "tech-rwt-education-hub.firebasestorage.app",
    messagingSenderId: "883411092191",
    appId: "1:883411092191:web:8d6d96b29034cecf119f6a"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

const container=document.getElementById("notes-list");

db.collection("notes")
  .orderBy("createdAt", "desc")
  .onSnapshot(snapshot => {
    container.innerHTML = "";
    if (snapshot.empty) {
      container.innerHTML = "<div class='empty'>No Notes Available Yet.</div>";
      return;
    }
    snapshot.forEach(doc => {
      const note = doc.data();
      container.innerHTML += `
        <div class="card">
          <h3>${note.title || "Untitled"}</h3>
          <div class="info">
            <strong>Class:</strong> ${note.class || "-"}
          </div>
          <div class="info">
            <strong>Subject:</strong> ${note.subject || "-"}
          </div>
          <a class="btn" href="${note.link || note.pdfLink}" target="_blank">
            📄 Open PDF
          </a>
        </div>
      `;
    });
  });
</script>

</body>
</html>
