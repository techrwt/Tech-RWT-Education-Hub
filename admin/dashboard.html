<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TECH RWT Admin Panel</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="sidebar">

<h2>TECH RWT</h2>

<p>Education Hub</p>

<ul>

<li class="active">🏠 Dashboard</li>

<li>❓ Questions</li>

<li>📝 Answers</li>

<li>📚 Notes</li>

<li>📄 PYQ</li>

<li>👨‍🎓 Students</li>

<li>⚙ Settings</li>

</ul>

</div>

<div class="main">

<header>

<h1>Dashboard</h1>

</header>

<div class="cards">

<div class="card">
<h2>0</h2>
<p>Total Questions</p>
</div>

<div class="card">
<h2>0</h2>
<p>Pending</p>
</div>

<div class="card">
<h2>0</h2>
<p>Answered</p>
</div>

<div class="card">
<h2>0</h2>
<p>Published</p>
</div>

</div>
<div class="toolbar">
  <input type="text" placeholder="🔍 Search Questions...">
  <select>
    <option>All Status</option>
    <option>Pending</option>
    <option>Answered</option>
  </select>
  <button>Add Notes</button>
  <button>Upload PYQ</button>
</div>
<div class="table-box">
  <h2>Latest Questions</h2>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Class</th>
        <th>Subject</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="questionsTable">
      <tr>
        <td colspan="5">Loading...</td>
      </tr>
    </tbody>
  </table>
</div>
</div>

<script src="script.js"></script>

</body>
</html>
