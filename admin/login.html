<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TECH RWT Admin Login</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-box {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        .login-box h1 {
            margin-bottom: 5px;
            color: #1e293b;
            font-size: 24px;
        }
        .login-box p {
            color: #64748b;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .login-box input {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        .login-box input:focus {
            border-color: #2563eb;
        }
        .login-box button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .login-box button:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h1>TECH RWT</h1>
        <p>Education Hub Admin</p>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Username" required autocomplete="username">
            <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
            <button type="submit">Login</button>
            <p id="error" style="color: #ef4444; margin-top: 15px; font-size: 13px; font-weight: 500;"></p>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Agar pehle se logged in hai toh seedha index par bhej do
            if (localStorage.getItem('adminLoggedIn') === 'true') {
                window.location.href = 'index.html';
            }

            const loginForm = document.getElementById('loginForm');
            if (loginForm) {
                loginForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    
                    const user = document.getElementById('username').value.trim();
                    const pass = document.getElementById('password').value.trim();
                    const errorEl = document.getElementById('error');

                    // Yahan aap apna username aur password badal sakte hain
                    if (user === 'admin' && pass === 'admin123') {
                        localStorage.setItem('adminLoggedIn', 'true');
                        window.location.href = 'index.html';
                    } else {
                        if (errorEl) errorEl.innerText = '⚠️ Invalid Username or Password!';
                    }
                });
            }
        });
    </script>

</body>
</html>
